name: Build Source

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'example/**'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - 'example/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build source
        run: npm run build
