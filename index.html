<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Browser</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        /* 启动加载壳：与主界面同一套令牌（浅色 Fluent 工业 CAD 控制台） */
        :root {
            color-scheme: light;
            --bg-app: #e8ebef;
            --bg-panel: #ffffff;
            --border-strong: #b3bac3;
            --text-main: #14181d;
            --text-muted: #5c636c;
            --accent: #0b5fa5;
            --radius-lg: 4px;
            --font-sans: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            overflow: hidden;
            background: var(--bg-app);
            color: var(--text-main);
            font-family: var(--font-sans);
            font-size: 12.5px;
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }
        #root { width: 100vw; height: 100vh; }

        button:focus { outline: none; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9000;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background: var(--bg-app);
        }
        .loading-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: min(280px, calc(100vw - 32px));
            padding: 18px 16px;
            background: var(--bg-panel);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-lg);
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.10);
        }
        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #cdd3da;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 12.5px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0;
            text-align: center;
        }
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation-duration: 1.6s; }
        }
    </style>
</head>
<body>
    <div id="root">
        <div class="loading-container">
            <div class="loading-card">
                <div class="spinner"></div>
                <div class="loading-text">正在启动…</div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.tsx"></script>
</body>
</html>
